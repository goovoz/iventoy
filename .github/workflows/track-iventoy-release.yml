name: Track iVentoy Upstream Release

# 自动跟随 iVentoy 官方发布（https://github.com/ventoy/PXE/releases）。
# 上游出现新的稳定版时：自动改版本引用 -> 提交推送 main -> 打 vX.Y.Z 标签 -> 触发镜像构建发布。
#
# [iventoy-fork] 上游无新版本时**不再直接空跑**，而是做两件事：
#   1. 对账 ghcr 上是否存在当前版本的镜像。若缺失（上一次构建失败 / 被清理 / 派发 403），
#      重新派发构建并在失败时变红。否则一旦「版本已 bump 但镜像没发出去」，第二天起
#      current == latest 就永远空跑，镜像会静默停在旧版本（2026-10-21 的 1.0.46 故障即此类）。
#   2. 对账「发布出去的镜像」与 main 的源码漂移：镜像里记着构建它的提交号（OCI label
#      org.opencontainers.image.revision），只要 main 上还有没进镜像的镜像相关改动
#      （Dockerfile / files/ / patches/ / .dockerignore），就按 main 重新发布一次。
#      2026-11-11 的故障即此类：补丁改了三轮、PR 全合并进 main，但「合并到 main」不会触发
#      docker-publish，ghcr 上的 latest / 1.0.49 一直停在打补丁之前那份。
#      main 的提交现在本身就会发布并强制覆盖 latest / 版本号，这条对账是**兜底**：
#      那次构建失败、被取消、或被 bump 提交跳过时，不再等下一次人工 dispatch。
#
# 机制详见 docs/UPSTREAM-SYNC.md。

on:
  schedule:
    - cron: "37 18 * * *" # 每天 18:37 UTC（北京时间次日 02:37）
  workflow_dispatch:
    inputs:
      version:
        description: "手动指定 iVentoy 版本（留空则自动获取上游最新稳定版）"
        required: false
        default: ""

permissions:
  contents: write
  # [iventoy-fork] 必须有 actions: write，否则 workflow_dispatch 会被 403 拒绝
  # （2026-10-21 故障：仅写 contents: write 时，1.0.45->1.0.46 的自动更新推送/打标签成功，
  #  但派发镜像构建 403 失败，导致 ghcr 镜像没有跟着更新）。
  actions: write
  # [iventoy-fork] 失败时要写 dsh-handoff issue，见文件末尾的 handoff job
  issues: write

concurrency:
  group: track-iventoy-release
  cancel-in-progress: false

env:
  PACKAGE: iventoy
  VERSION_PATTERN: 'IVENTOY_VERSION:-\K[0-9]+\.[0-9]+\.[0-9]+'

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 获取上游最新版本
        id: latest
        # 用户输入经 env 传入，不直接插值进 shell（否则 "1.0.48"; rm -rf / 这类输入会执行）
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_VERSION}" ]]; then
            LATEST="${INPUT_VERSION}"
          else
            LATEST=$(curl -fsSL --retry 3 --retry-delay 5 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/ventoy/PXE/releases/latest \
              | jq -r '.tag_name' | sed 's/^[vV]//')
          fi
          if [[ ! "${LATEST}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::无法从上游解析出版本号: '${LATEST}'（tag 命名可能已变更，需人工处理）"
            exit 1
          fi
          echo "version=${LATEST}" >> "$GITHUB_OUTPUT"

      - name: 读取仓库当前版本
        id: current
        run: |
          set -euo pipefail
          CURRENT=$(grep -oP "${VERSION_PATTERN}" Dockerfile | head -1 || true)
          if [[ -z "${CURRENT}" ]]; then
            echo "::error::Dockerfile 中未找到 IVENTOY_VERSION 默认值"
            exit 1
          fi
          echo "version=${CURRENT}" >> "$GITHUB_OUTPUT"

      - name: 校验上游发布资产齐全
        id: assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.latest.outputs.version }}
        run: |
          set -euo pipefail
          NAMES=$(curl -fsSL --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/ventoy/PXE/releases/tags/v${V}" \
            | jq -r '.assets[].name')
          for f in "iventoy-${V}-linux-x86_64-free.tar.gz" "iventoy-${V}-linux-arm64-trial.tar.gz"; do
            if ! grep -qxF "$f" <<< "$NAMES"; then
              echo "::error::上游 v${V} 缺少构建所需资产: $f（命名可能已变更，需人工处理）"
              exit 1
            fi
          done

      # [iventoy-fork] 补丁闸：先把新版本的两个二进制真正下载下来跑 --check。
      # 签名失配就停在这里 —— 不 bump 版本、不打 tag、不派发构建，
      # 避免「镜像能起但 WebUI 消失 / 端口变随机」这种只能靠人肉发现的坏版本。
      # 重新锚定的步骤见 patches/README.md。
      - name: 校验补丁能否应用到新版本
        env:
          V: ${{ steps.latest.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/pt
          for spec in "amd64 x86_64 free" "arm64 arm64 trial"; do
            set -- $spec
            arch=$1; suffix=$2; edition=$3
            f="iventoy-${V}-linux-${suffix}-${edition}.tar.gz"
            dir="/tmp/pt/${arch}"
            mkdir -p "$dir"
            curl -fsSL --retry 3 --retry-delay 5 -o "/tmp/pt/${f}" \
              "https://github.com/ventoy/PXE/releases/download/v${V}/${f}"
            tar -xzf "/tmp/pt/${f}" -C "$dir"
            src=$(find "$dir" -maxdepth 2 -type d -name iventoy | head -1)
            [ -n "$src" ] || src="${dir}/iventoy"
            echo "--- ${arch}: ${src} ---"
            python3 patches/iventoy_patch.py --check "${src}/lib/iventoy" || {
              echo "::error::v${V} 的 ${arch} 二进制补丁签名失配，本轮不更新版本。请按 patches/README.md 重新锚定后手动 workflow_dispatch"
              exit 1
            }
          done

      # [iventoy-fork] 对账：仓库里的版本号必须真的对应一个已发布的镜像。
      # 查询失败（401/5xx/网络）记为 unknown，本轮不据此判定，避免误触发构建风暴。
      - name: 对账：当前版本镜像是否已发布
        id: registry
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ steps.current.outputs.version }}
        run: |
          set -uo pipefail
          CODE=000
          for attempt in 1 2 3; do
            TOKEN=$(curl -sS --max-time 20 \
              "https://ghcr.io/token?scope=repository:${OWNER}/${PACKAGE}:pull&service=ghcr.io" \
              | jq -r '.token // empty') || TOKEN=""
            if [[ -z "${TOKEN}" ]]; then
              echo "第 ${attempt} 次获取 ghcr token 失败，重试"
              sleep 5
              continue
            fi
            CODE=$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 20 \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
              "https://ghcr.io/v2/${OWNER}/${PACKAGE}/manifests/${VERSION}") || CODE=000
            if [[ "${CODE}" == "200" || "${CODE}" == "404" ]]; then
              break
            fi
            echo "第 ${attempt} 次查询 ghcr 返回 HTTP ${CODE}，重试"
            sleep 5
          done
          case "${CODE}" in
            200)
              echo "published=true" >> "$GITHUB_OUTPUT"
              echo "ghcr 已存在 ${VERSION} 镜像"
              ;;
            404)
              echo "published=false" >> "$GITHUB_OUTPUT"
              echo "::warning::ghcr 缺少 ${VERSION} 镜像，本轮将重新派发构建"
              ;;
            *)
              echo "published=unknown" >> "$GITHUB_OUTPUT"
              echo "::warning::查询 ghcr 失败（HTTP ${CODE}），本轮不做镜像对账判定"
              ;;
          esac

      # [iventoy-fork L2] 源码漂移对账。
      #
      # 判定口径：镜像 config 里的 org.opencontainers.image.revision（构建它的提交）与
      # main 的 HEAD 在「影响镜像内容的路径」上是否有差异。docs/、README、workflow 之类
      # 的提交不重建镜像 —— 否则每天都会白跑一次多架构构建。
      #
      # 只在「版本没变且镜像已发布」时判定：版本变更与镜像缺失两种情况各有自己的派发路径，
      # 这里再判一次会重复构建。
      - name: 对账：发布镜像与 main 的源码漂移
        id: drift
        if: >-
          steps.latest.outputs.version == steps.current.outputs.version
          && steps.registry.outputs.published == 'true'
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ steps.current.outputs.version }}
        run: |
          set -uo pipefail
          # 影响镜像内容的路径；其余改动不触发重建
          IMAGE_PATHS=(Dockerfile .dockerignore files patches)
          HEAD_SHA=$(git rev-parse HEAD)

          TOKEN=""
          for attempt in 1 2 3; do
            TOKEN=$(curl -sS --max-time 20 \
              "https://ghcr.io/token?scope=repository:${OWNER}/${PACKAGE}:pull&service=ghcr.io" \
              | jq -r '.token // empty') || TOKEN=""
            [[ -n "${TOKEN}" ]] && break
            echo "第 ${attempt} 次获取 ghcr token 失败，重试"
            sleep 5
          done
          if [[ -z "${TOKEN}" ]]; then
            echo "::warning::取 ghcr token 失败，本轮不做漂移判定"
            echo "drift=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ACCEPT="application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json"
          # blobs 接口会 307 跳到对象存储，不带 -L 会拿到 0 字节 —— 实测过：
          # curl -sS 返回空 body、退出码 0，后面 jq 解析失败只能记成 unknown，
          # 漂移对账就等于永远不生效。manifest 也一并带 -L，免得将来被改成跳转又踩一次。
          MAN=$(curl -sSL --max-time 30 -H "Authorization: Bearer ${TOKEN}" -H "Accept: ${ACCEPT}" \
            "https://ghcr.io/v2/${OWNER}/${PACKAGE}/manifests/${VERSION}") || MAN=""
          # 多架构索引：先定位 linux/amd64 子清单，再取它的 config blob
          CHILD=$(printf '%s' "${MAN}" \
            | jq -r '[.manifests[]? | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest] | first // empty' 2>/dev/null)
          if [[ -n "${CHILD}" ]]; then
            MAN=$(curl -sSL --max-time 30 -H "Authorization: Bearer ${TOKEN}" -H "Accept: ${ACCEPT}" \
              "https://ghcr.io/v2/${OWNER}/${PACKAGE}/manifests/${CHILD}") || MAN=""
          fi
          CFG=$(printf '%s' "${MAN}" | jq -r '.config.digest // empty' 2>/dev/null)
          if [[ -z "${CFG}" ]]; then
            echo "::warning::读不到 ${VERSION} 镜像的 config digest，本轮不做漂移判定"
            echo "drift=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          REV=$(curl -sSL --max-time 30 -H "Authorization: Bearer ${TOKEN}" \
            "https://ghcr.io/v2/${OWNER}/${PACKAGE}/blobs/${CFG}" \
            | jq -r '.config.Labels["org.opencontainers.image.revision"] // empty' 2>/dev/null) || REV=""
          if [[ -z "${REV}" ]]; then
            echo "::warning::镜像里没有 org.opencontainers.image.revision 标签，无法判定漂移"
            echo "drift=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "镜像 ${VERSION} 构建自：${REV}"
          echo "main 当前 HEAD：    ${HEAD_SHA}"

          if [[ "${REV}" == "${HEAD_SHA}" ]]; then
            echo "::notice::镜像就是 main 的最新提交，无漂移"
            echo "drift=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "${REV}^{commit}" 2>/dev/null; then
            echo "::warning::镜像记录的提交 ${REV} 不在本仓库历史里（可能来自已删除的分支），按有漂移处理"
            echo "drift=true" >> "$GITHUB_OUTPUT"
            echo "reason=unknown-sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # diff 出错（退出码 128 等）时按有漂移处理：宁可多重建一次，也不要漏掉补丁改动
          if git diff --quiet "${REV}" "${HEAD_SHA}" -- "${IMAGE_PATHS[@]}"; then
            echo "::notice::${REV} 之后的提交没有碰 ${IMAGE_PATHS[*]}，无需重建"
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "--- 未进镜像的改动 ---"
            git diff --stat "${REV}" "${HEAD_SHA}" -- "${IMAGE_PATHS[@]}" | tail -20
            echo "::warning::${VERSION} 镜像缺少 ${REV}..${HEAD_SHA} 之间的镜像相关改动，将按 main 重新发布"
            echo "drift=true" >> "$GITHUB_OUTPUT"
            echo "reason=source-drift" >> "$GITHUB_OUTPUT"
          fi

      # [iventoy-fork L2] 把「要不要发、发哪个 ref」收敛成一处理，避免多个 if 条件互相打架。
      # 优先级：新版本 > 镜像缺失 > 源码漂移 > 无事可做。
      - name: 决定本轮动作
        id: plan
        env:
          OLD: ${{ steps.current.outputs.version }}
          NEW: ${{ steps.latest.outputs.version }}
          PUBLISHED: ${{ steps.registry.outputs.published }}
          DRIFT: ${{ steps.drift.outputs.drift }}
        run: |
          set -euo pipefail
          if [[ "${NEW}" != "${OLD}" ]]; then
            ACTION=release-tag
            REF="v${NEW}"
            DESC="上游 ${OLD} -> ${NEW}：改版本引用 + 打标签 + 发布镜像"
          elif [[ "${PUBLISHED}" == "false" ]]; then
            ACTION=backfill
            REF="v${OLD}"
            DESC="ghcr 缺 ${OLD} 镜像：按已存在的标签重新发布"
          elif [[ "${DRIFT}" == "true" ]]; then
            ACTION=refresh
            REF=main
            DESC="镜像落后 main 的镜像相关改动：按 main 重新发布 ${OLD}"
          else
            ACTION=none
            REF=""
            DESC="已是最新，无需动作"
          fi
          echo "本轮动作：${ACTION}（${DESC}）"
          {
            echo "action=${ACTION}"
            echo "ref=${REF}"
            echo "desc=${DESC}"
          } >> "$GITHUB_OUTPUT"

      - name: 更新版本引用并推送
        if: steps.plan.outputs.action == 'release-tag'
        env:
          OLD: ${{ steps.current.outputs.version }}
          NEW: ${{ steps.latest.outputs.version }}
        run: |
          set -euo pipefail
          # [iventoy-fork] 版本引用由本 workflow 自动维护，改动模式前先读 docs/UPSTREAM-SYNC.md
          # docker-compose.yml 用 :latest、Makefile 的 VERSION 从 Dockerfile 现读，均不含版本号，
          # 所以只有下面两个文件需要替换。
          sed -i "s|\${IVENTOY_VERSION:-${OLD}}|\${IVENTOY_VERSION:-${NEW}}|g" Dockerfile
          sed -i "s|/ ${OLD}: iVentoy v${OLD}|/ ${NEW}: iVentoy v${NEW}|g" README.md
          # 逐文件校验：任何一个文件没被改到，说明引用模式失效，立即失败而不是推一个半新半旧的状态
          for f in Dockerfile README.md; do
            if git diff --quiet -- "$f"; then
              echo "::error::${OLD} -> ${NEW} 但 ${f} 没有任何改动，版本引用模式可能已失效"
              exit 1
            fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Dockerfile README.md
          git commit -m "chore: auto-update iVentoy ${OLD} -> ${NEW}"
          git push origin HEAD:main

      - name: 创建版本标签
        id: tag
        if: steps.plan.outputs.action == 'release-tag' || steps.plan.outputs.action == 'backfill'
        env:
          V: ${{ steps.latest.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${V}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "标签 ${TAG} 已存在，跳过创建"
          else
            git tag "$TAG"
            git push origin "refs/tags/${TAG}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: 触发镜像构建发布
        id: dispatch
        if: steps.plan.outputs.action != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ steps.plan.outputs.ref }}
        run: |
          set -euo pipefail
          API="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/docker-publish.yml"
          # 派发前记下该 ref 上已有的最大 run id：204 只代表「请求被接受」，
          # 必须看到 id 更大的运行记录才算真的建立。refresh 用的 ref=main 上本来就有
          # 历史 run，没有基线就会把很久以前那一次当成本次结果。
          BASELINE=$(curl -sS --retry 3 --retry-delay 5 -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" "${API}/runs?per_page=50" \
              | jq -r --arg ref "${REF}" '[.workflow_runs[]? | select(.head_branch == $ref) | .id] | max // 0')
          echo "ref=${REF} 上的基线 run id：${BASELINE:-0}"

          CODE=""
          # workflow_dispatch 是 GITHUB_TOKEN 触发级联的法定例外，可正常创建新 run；
          # 但令牌必须同时具备 actions: write（见文件顶部 permissions）。
          for attempt in 1 2 3; do
            CODE=$(curl -sS -o /tmp/dispatch.body -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API}/dispatches" -d "{\"ref\":\"${REF}\"}") || CODE="000"
            if [[ "$CODE" == "204" ]]; then break; fi
            echo "第 ${attempt} 次派发失败（HTTP ${CODE})：$(cat /tmp/dispatch.body 2>/dev/null)"
            [[ "$attempt" -lt 3 ]] && sleep 10
          done
          if [[ "$CODE" != "204" ]]; then
            echo "::error::派发镜像构建失败（HTTP ${CODE}）。403 通常表示 permissions 缺少 actions: write"
            exit 1
          fi
          echo "已派发 docker-publish.yml @ ${REF}（HTTP 204）"

          # 二次确认：接口返回 204 不等于 run 真的建立了，必须查到运行记录才算成功
          RUN_ID=""
          for attempt in 1 2 3 4 5 6 7 8; do
            sleep 8
            RUNS=$(curl -sS --retry 3 --retry-delay 5 -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" "${API}/runs?per_page=50" || true)
            RUN_ID=$(printf '%s' "${RUNS}" | jq -r --arg ref "${REF}" --argjson base "${BASELINE:-0}" \
              '[.workflow_runs[]? | select(.head_branch == $ref) | select(.id > $base) | .id] | max // empty')
            [[ -n "${RUN_ID}" ]] && break
            echo "第 ${attempt} 次查询未看到 ${REF} 的新构建记录，继续等待"
          done
          if [[ -z "${RUN_ID}" ]]; then
            echo "::error::派发返回 204，但未查到 ${REF} 的新构建记录，镜像不会更新，需人工检查"
            exit 1
          fi
          echo "已确认 ${REF} 的构建记录存在（run ${RUN_ID}），镜像将自动更新"
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: 等待镜像构建完成
        id: wait_build
        if: steps.dispatch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          set -uo pipefail
          if [[ -z "${RUN_ID}" ]]; then
            echo "::error::未获取到构建 run id，无法确认镜像是否发布"
            exit 1
          fi
          echo "跟踪构建 run: ${RUN_ID}"
          for i in $(seq 1 60); do
            sleep 20
            # -f 会在 5xx/瞬时错误时直接失败，这里刻意不用；查询失败只当作本轮无结论
            J=$(curl -sS --max-time 30 --retry 3 --retry-delay 5 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" || true)
            ST=$(printf '%s' "${J}" | jq -r '.status // empty' 2>/dev/null)
            CO=$(printf '%s' "${J}" | jq -r '.conclusion // empty' 2>/dev/null)
            echo "[${i}/60] status=${ST:-<查询失败>} conclusion=${CO:-<无>}"
            if [[ "${ST}" == "completed" ]]; then
              if [[ "${CO}" == "success" ]]; then
                echo "镜像构建发布成功"
                exit 0
              fi
              echo "::error::镜像构建失败（conclusion=${CO}），ghcr 镜像未更新：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"
              exit 1
            fi
          done
          echo "::error::等待镜像构建超时（20 分钟），请查看 ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"
          exit 1

      - name: 结果汇总
        if: always()
        env:
          OLD: ${{ steps.current.outputs.version }}
          NEW: ${{ steps.latest.outputs.version }}
          PUBLISHED: ${{ steps.registry.outputs.published }}
          DRIFT: ${{ steps.drift.outputs.drift }}
          DRIFT_REASON: ${{ steps.drift.outputs.reason }}
          ACTION: ${{ steps.plan.outputs.action }}
          REF: ${{ steps.plan.outputs.ref }}
          DISPATCH: ${{ steps.dispatch.outcome }}
          BUILD: ${{ steps.wait_build.outcome }}
        run: |
          {
            echo "### iVentoy 上游版本跟踪"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 上游最新 | ${NEW:-<获取失败>} |"
            echo "| 仓库当前 | ${OLD:-<读取失败>} |"
            case "${PUBLISHED}" in
              true)    echo "| ghcr 对账 | 已有 ${OLD} 镜像 |" ;;
              false)   echo "| ghcr 对账 | **缺少 ${OLD} 镜像，已安排重建** |" ;;
              *)       echo "| ghcr 对账 | 查询失败，本轮跳过（${PUBLISHED:-unknown}） |" ;;
            esac
            case "${DRIFT}" in
              true)    echo "| 源码漂移 | **镜像落后 main（${DRIFT_REASON:-source-drift}），已安排重新发布** |" ;;
              false)   echo "| 源码漂移 | 无（镜像就是 main 的镜像相关代码） |" ;;
              "")      echo "| 源码漂移 | 本轮未判定（版本变更或镜像缺失优先处理） |" ;;
              *)       echo "| 源码漂移 | 无法判定（${DRIFT}），本轮跳过 |" ;;
            esac
            echo "| 本轮动作 | ${ACTION:-unknown} ${REF:+(${REF})} |"
            if [[ "${ACTION}" == "none" || -z "${ACTION}" ]]; then
              echo "| 镜像构建 | 未触发 |"
            elif [[ "${DISPATCH}" != "success" ]]; then
              echo "| 镜像构建 | **派发失败（${DISPATCH:-unknown}），ghcr 镜像不会更新，需人工处理** |"
            elif [[ "${BUILD}" == "success" ]]; then
              echo "| 镜像构建 | 已成功发布（ghcr 标签：latest + ${NEW}） |"
            elif [[ "${BUILD}" == "failure" ]]; then
              echo "| 镜像构建 | **构建失败，ghcr 镜像仍为旧版，需人工处理** |"
            else
              echo "| 镜像构建 | 派发成功但未确认结果（${BUILD:-unknown}） |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # [iventoy-fork] 跟踪失败（上游更新推送了、但镜像构建红/派发失败）时同样要交接：
  # 以前只在 run summary 里写「需人工处理」，没有任何 issue，DSH 接不到。
  handoff:
    needs: track
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: 汇总失败上下文
        id: ctx
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          V=$(sed -n 's/.*IVENTOY_VERSION:-\([0-9][0-9.]*\).*/\1/p' Dockerfile | head -1)
          echo "title=上游跟踪失败: iVentoy ${V:-unknown}" >> "${GITHUB_OUTPUT}"
          {
            echo "## 上游跟踪失败：iVentoy ${V:-<未知版本>}"
            echo
            echo "- 提交：\`${{ github.sha }}\`"
            echo "- 运行：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "### 失败日志（尾部 120 行）"
            echo '```'
            gh run view "${{ github.run_id }}" --log-failed 2>/dev/null | tail -120 || echo '<取不到日志>'
            echo '```'
            echo
            echo "### 接手怎么做"
            echo
            echo "1. 先看本次 run summary 的「镜像构建」一行："
            echo "   - 派发失败（403 等）→ 查 workflow 的 actions: write 权限与 token；"
            echo "   - 构建失败 → 打开被派发的那次 Build and Push，那里会另有一条 handoff issue。"
            echo "2. 构建失败若出在补丁阶段，按 \`patches/README.md\` 的站点表核对签名，"
            echo "   常见是上游改了桩函数形态或 RX 段尾部空隙。"
          } > /tmp/handoff.md
          cat /tmp/handoff.md

      - uses: ./.github/actions/handoff
        with:
          title: ${{ steps.ctx.outputs.title }}
          body-file: /tmp/handoff.md
