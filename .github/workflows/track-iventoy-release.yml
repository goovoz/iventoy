name: Track iVentoy Upstream Release

# 自动跟随 iVentoy 官方发布（https://github.com/ventoy/PXE/releases）。
# 上游出现新的稳定版时：自动改版本引用 -> 提交推送 main -> 打 vX.Y.Z 标签 -> 触发镜像构建发布。
# 上游无新版本时每天空跑退出，不做任何推送。机制详见 docs/UPSTREAM-SYNC.md。

on:
  schedule:
    - cron: "37 18 * * *" # 每天 18:37 UTC（北京时间次日 02:37）
  workflow_dispatch:
    inputs:
      version:
        description: "手动指定 iVentoy 版本（留空则自动获取上游最新稳定版）"
        required: false
        default: ""

permissions:
  contents: write
  # [iventoy-fork] 必须有 actions: write，否则 workflow_dispatch 会被 403 拒绝
  # （2026-10-21 故障：仅写 contents: write 时，1.0.45->1.0.46 的自动更新推送/打标签成功，
  #  但派发镜像构建 403 失败，导致 ghcr 镜像没有跟着更新）。
  actions: write

concurrency:
  group: track-iventoy-release
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 获取上游最新版本
        id: latest
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.version }}" ]]; then
            LATEST="${{ inputs.version }}"
          else
            LATEST=$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/ventoy/PXE/releases/latest \
              | jq -r '.tag_name' | sed 's/^v//')
          fi
          if [[ ! "$LATEST" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::无法从上游解析出版本号: '$LATEST'（tag 命名可能已变更，需人工处理）"
            exit 1
          fi
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 读取仓库当前版本
        id: current
        run: |
          set -euo pipefail
          CURRENT=$(grep -oP 'IVENTOY_VERSION:-\K[0-9][0-9.]*' Dockerfile | head -1)
          if [[ -z "$CURRENT" ]]; then
            echo "::error::Dockerfile 中未找到 IVENTOY_VERSION 默认值"
            exit 1
          fi
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: 校验上游发布资产齐全
        id: assets
        run: |
          set -euo pipefail
          V="${{ steps.latest.outputs.version }}"
          NAMES=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/ventoy/PXE/releases/tags/v${V}" \
            | jq -r '.assets[].name')
          for f in "iventoy-${V}-linux-x86_64-free.tar.gz" "iventoy-${V}-linux-arm64-trial.tar.gz"; do
            if ! grep -qxF "$f" <<< "$NAMES"; then
              echo "::error::上游 v${V} 缺少构建所需资产: $f（命名可能已变更，需人工处理）"
              exit 1
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 更新版本引用并推送
        if: steps.latest.outputs.version != steps.current.outputs.version
        run: |
          set -euo pipefail
          OLD="${{ steps.current.outputs.version }}"
          NEW="${{ steps.latest.outputs.version }}"
          # [iventoy-fork] 以下四处版本引用由本 workflow 自动维护，改动模式前先读 docs/UPSTREAM-SYNC.md
          sed -i "s|\${IVENTOY_VERSION:-${OLD}}|\${IVENTOY_VERSION:-${NEW}}|" Dockerfile
          sed -i "s|iventoy:${OLD}|iventoy:${NEW}|g" Makefile
          sed -i "s|iventoy:${OLD}|iventoy:${NEW}|" docker-compose.yml
          sed -i "s|/ ${OLD}: iVentoy v${OLD}|/ ${NEW}: iVentoy v${NEW}|" README.md
          if git diff --quiet; then
            echo "::error::版本 ${OLD} -> ${NEW}，但没有任何文件被改动，疑似引用模式失效，终止推送"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: auto-update iVentoy ${OLD} -> ${NEW}"
          git push origin HEAD:main

      - name: 创建版本标签
        if: steps.latest.outputs.version != steps.current.outputs.version
        run: |
          set -euo pipefail
          TAG="v${{ steps.latest.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "标签 ${TAG} 已存在，跳过创建"
          else
            git tag "$TAG"
            git push origin "refs/tags/${TAG}"
          fi

      - name: 触发镜像构建发布
        id: dispatch
        if: steps.latest.outputs.version != steps.current.outputs.version
        run: |
          set -euo pipefail
          TAG="v${{ steps.latest.outputs.version }}"
          URL="$GITHUB_API_URL/repos/${{ github.repository }}/actions/workflows/docker-publish.yml/dispatches"
          CODE=""
          # workflow_dispatch 是 GITHUB_TOKEN 触发级联的法定例外，可正常创建新 run；
          # 但令牌必须同时具备 actions: write（见文件顶部 permissions）。
          for attempt in 1 2 3; do
            CODE=$(curl -sS -o /tmp/dispatch.body -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$URL" -d "{\"ref\":\"${TAG}\"}") || CODE="000"
            if [[ "$CODE" == "204" ]]; then break; fi
            echo "第 ${attempt} 次派发失败（HTTP ${CODE})：$(cat /tmp/dispatch.body 2>/dev/null)"
            [[ "$attempt" -lt 3 ]] && sleep 10
          done
          if [[ "$CODE" != "204" ]]; then
            echo "::error::派发镜像构建失败（HTTP ${CODE}）。403 通常表示 permissions 缺少 actions: write"
            exit 1
          fi
          echo "已派发 docker-publish.yml @ ${TAG}（HTTP 204）"
          # 二次确认：接口返回 204 不等于 run 真的建立了，必须查到运行记录才算成功
          sleep 8
          RUNS=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/${{ github.repository }}/actions/workflows/docker-publish.yml/runs?per_page=20")
          COUNT=$(printf '%s' "$RUNS" | jq --arg tag "$TAG" '[.workflow_runs[] | select(.head_branch == $tag)] | length')
          if [[ "${COUNT:-0}" -lt 1 ]]; then
            echo "::error::派发返回 204，但未查到 ${TAG} 的构建记录，镜像不会更新，需人工检查"
            exit 1
          fi
          echo "已确认 ${TAG} 的构建记录存在（${COUNT} 条），镜像将自动更新"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 结果汇总
        if: always()
        run: |
          OLD="${{ steps.current.outputs.version }}"
          NEW="${{ steps.latest.outputs.version }}"
          DISPATCH="${{ steps.dispatch.outcome }}"
          {
            echo "### iVentoy 上游版本跟踪"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 上游最新 | ${NEW:-<获取失败>} |"
            echo "| 仓库更新前 | ${OLD:-<读取失败>} |"
            if [[ -n "$NEW" && "$NEW" != "$OLD" ]]; then
              echo "| 代码与标签 | 已更新版本引用并创建 refs/tags/v${NEW} |"
              if [[ "$DISPATCH" == "success" ]]; then
                echo "| 镜像构建 | 已派发 docker-publish.yml 并确认运行记录 |"
              elif [[ "$DISPATCH" == "skipped" ]]; then
                echo "| 镜像构建 | 未执行（版本未变更） |"
              else
                echo "| 镜像构建 | **派发失败（${DISPATCH:-unknown}），ghcr 镜像不会更新，需人工处理** |"
              fi
            else
              echo "| 操作 | 已是最新，无需更新 |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
