name: Validate

# [iventoy-fork L0] 静态检查 + 启动逻辑自测 + 可选的真实构建。
# 之前仓库里只有 tests/ 和 Makefile 的 test 目标，CI 从不执行；Dockerfile 也只有
# 发版那一刻才被编译，改动出错要等下一次 tag 才知道。
#
# - lint：每次 push / PR 都跑（shellcheck + yamllint + hadolint + entrypoint 自测）
# - build：只在 workflow_dispatch 或 fix/ 分支上跑，真实编译一次镜像但不推送

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  YAMLLINT_CONFIG: >-
    {extends: default,
     rules: {line-length: disable, comments: disable, comments-indentation: disable,
             document-start: disable, truthy: disable, brackets: disable}}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: shellcheck
        run: shellcheck --severity=warning files/docker-entrypoint.sh tests/test-container-entrypoint.sh

      - name: yamllint
        run: |
          set -euo pipefail
          # 用 venv 装：ubuntu-24.04 runner 的系统 python 是 PEP 668 托管环境，
          # 直接 pip install 会被 externally-managed-environment 拒绝
          python3 -m venv /tmp/yl
          /tmp/yl/bin/pip install --quiet --disable-pip-version-check yamllint
          /tmp/yl/bin/yamllint -d "${YAMLLINT_CONFIG}" .github/workflows docker-compose.yml deploy/docker-compose.yml

      # Docker Hub 说明页里贴了一份可直接复制的 compose，仓库里又有 deploy/docker-compose.yml
      # 供 curl -O 使用。两份必须一致，否则部署方会照着过期的那份跑。
      - name: Docs consistency (DOCKERHUB.md ↔ deploy/docker-compose.yml)
        run: python3 .github/scripts/check-dockerhub-readme.py

      - name: hadolint
        run: |
          set -euo pipefail
          # 用官方发布的静态二进制：hadolint/hadolint 镜像的 ENTRYPOINT 在不同 tag 上
          # 行为不一致（曾出现把 --failure-threshold 当成可执行文件），二进制最省心
          curl -fsSL -o /tmp/hadolint \
            https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          chmod +x /tmp/hadolint
          /tmp/hadolint --failure-threshold error Dockerfile

      - name: Container entrypoint self-test
        run: sh tests/test-container-entrypoint.sh

  # [iventoy-fork] 补丁签名闸：补丁按符号名 + 指令签名定位，上游一改版就可能失配。
  # 这里在 push/PR 阶段就拿当前固定版本跑 --check，失配立即红，不用等发版那一刻。
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 缓存上游安装包
        uses: actions/cache@v4
        with:
          path: /tmp/pt
          # Dockerfile 里的版本号变了 key 就变，旧缓存自动失效
          key: iventoy-assets-${{ hashFiles('Dockerfile') }}

      - name: 校验补丁签名（amd64 + arm64）
        run: |
          set -euo pipefail
          V=$(grep -oP 'IVENTOY_VERSION:-\K[0-9]+\.[0-9]+\.[0-9]+' Dockerfile | head -1)
          echo "上游版本 v${V}"
          mkdir -p /tmp/pt
          rc=0
          for spec in "amd64 x86_64 free" "arm64 arm64 trial"; do
            set -- $spec
            arch=$1; suffix=$2; edition=$3
            f="iventoy-${V}-linux-${suffix}-${edition}.tar.gz"
            dir="/tmp/pt/${arch}"
            mkdir -p "$dir"
            [ -s "/tmp/pt/${f}" ] || curl -fsSL --retry 3 --retry-delay 5 -o "/tmp/pt/${f}" \
              "https://github.com/ventoy/PXE/releases/download/v${V}/${f}"
            tar -xzf "/tmp/pt/${f}" -C "$dir"
            # 上游包顶层目录名不一定叫 iventoy，按 Dockerfile 的同一套规则找
            src=$(find "$dir" -maxdepth 2 -type d -name iventoy | head -1)
            [ -n "$src" ] || src="${dir}/iventoy"
            echo "--- ${arch}: ${src} ---"
            python3 patches/iventoy_patch.py --check "${src}/lib/iventoy" || rc=1
          done
          if [ "$rc" -ne 0 ]; then
            echo "::error::补丁签名与 v${V} 不再匹配，需要重新锚定（见 patches/README.md）"
          fi
          exit "$rc"

  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/fix/')
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 只验证两个架构都能编译（含 sha256 校验、解包结构断言），不推送任何镜像
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha,scope=iventoy
