name: Build and Push Docker Images

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY_IMAGE: iventoy

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # [iventoy-fork L1] fork 不继承上游仓库的 secrets。未配置 Docker Hub 凭据时
      # 只发布到 ghcr.io，避免 login/push 步骤直接失败。
      - name: Resolve publish targets
        id: targets
        run: |
          set -euo pipefail
          GHCR_IMAGE="ghcr.io/${{ github.repository_owner }}/${{ env.REGISTRY_IMAGE }}"
          if [[ -n "${{ secrets.DOCKERHUB_USERNAME }}" && -n "${{ secrets.DOCKERHUB_TOKEN }}" ]]; then
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
            {
              echo "images<<EOF"
              echo "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.REGISTRY_IMAGE }}"
              echo "$GHCR_IMAGE"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "dockerhub=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets，本次仅发布到 ghcr.io"
            {
              echo "images<<EOF"
              echo "$GHCR_IMAGE"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request' && steps.targets.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # [iventoy-fork L1] tag 事件取 tag 版本；其余触发（含 track-iventoy-release.yml
      # 的派发与手动 dispatch）改为读取 Dockerfile 当前默认版本。
      # 原实现为非 tag 时硬编码回退值，会构建出过期版本。
      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            VERSION=${VERSION#v}
          else
            VERSION=$(grep -oP 'IVENTOY_VERSION:-\K[0-9][0-9.]*' Dockerfile | head -1)
          fi
          echo "iventoy_version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.targets.outputs.images }}
          tags: |
            # [iventoy-fork L1] 标签策略：只保留 latest + 精确版本号（1.0.45 这类），
            # 不再产出 major/minor/branch 浮动标签，保持包内标签干净。详见 docs/UPSTREAM-SYNC.md。
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # [iventoy-fork L1] 关闭 provenance/SBOM attestation：它们会在镜像 index 里
          # 额外产生 unknown/unknown 平台条目，污染平台清单。代价是失去 SLSA 证明。
          provenance: false
          sbom: false
          build-args: |
            IVENTOY_VERSION=${{ steps.version.outputs.iventoy_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
