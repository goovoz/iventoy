name: Build and Push Docker Images

on:
  push:
    # [iventoy-fork L2] main 的提交也直接发布，并且**强制覆盖** latest / 版本号：
    # 镜像必须跟着代码走，不再另开 :edge 之类的旁路 tag。
    # [iventoy-fork L1] tag 只接受语义化版本号。此前是 "*"，任意 tag 都能触发构建，
    # 而 latest 又会无条件刷新，推一个旧 tag 就会把 latest 回退到旧版本。
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      targets:
        description: "发布到哪里"
        type: choice
        options:
          - both # ghcr.io + Docker Hub（默认）
          - hub # 只推 Docker Hub（用它补铺/修 Hub 上的镜像，不动 ghcr）
          - ghcr # 只推 ghcr.io
        default: both
        required: false

permissions:
  # [iventoy-fork L1] 本 workflow 不写仓库内容，只推镜像包：权限收紧到最小集合。
  contents: read
  packages: write

env:
  REGISTRY_IMAGE: iventoy

# 同一 ref 的构建串行执行，避免两个构建并发抢推 latest / 同一个版本 tag。
# 这里刻意不做 cancel-in-progress：一次运行的结尾会改写 tag，半途取消会留下
# 「latest 走了、版本号没走」这类半新半旧的状态。连续推送就排队。
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # [iventoy-fork L0] 发布前先跑 entrypoint 自检：启动逻辑是镜像唯一的自有代码，
  # 之前 tests/ 只在本地 make test 里跑，CI 从不执行。
  #
  # track-iventoy-release.yml 的版本 bump 提交（`chore: auto-update iVentoy ...`）
  # 会在同一次运行里紧接着打 tag，那条 tag 推送会触发一次完整的发布构建；
  # bump 提交自己再发布一遍纯属重复，这里直接跳过。
  test:
    if: >-
      github.event_name != 'push'
      || github.ref != 'refs/heads/main'
      || !contains(github.event.head_commit.message, 'auto-update iVentoy')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Container entrypoint self-test
        run: sh tests/test-container-entrypoint.sh

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # [iventoy-fork L1] fork 不继承上游仓库的 secrets。未配置 Docker Hub 凭据时
      # 只发布到 ghcr.io，避免 login/push 步骤直接失败。
      # secrets 一律经 env 传入，不直接插值进 shell，避免特殊字符破坏脚本。
      #
      # targets 输入支持「只推 Hub / 只推 ghcr」：补铺 Docker Hub 时不必顺带重建 ghcr。
      - name: Resolve publish targets
        id: targets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          WANT: ${{ inputs.targets || 'both' }}
        run: |
          set -euo pipefail
          GHCR_IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/${REGISTRY_IMAGE}"
          HUB_IMAGE="docker.io/${DOCKERHUB_USERNAME}/${REGISTRY_IMAGE}"
          HAVE_HUB=false
          if [[ -n "${DOCKERHUB_USERNAME}" && -n "${DOCKERHUB_TOKEN}" ]]; then
            HAVE_HUB=true
          fi

          IMAGES=""
          case "${WANT}" in
            both) WANT_HUB=$HAVE_HUB; WANT_GHCR=true ;;
            hub)  WANT_HUB=$HAVE_HUB; WANT_GHCR=false ;;
            ghcr) WANT_HUB=false;     WANT_GHCR=true ;;
            *) echo "::error::未知 targets='${WANT}'"; exit 1 ;;
          esac

          if [[ "${WANT_HUB}" == "true" ]]; then
            IMAGES="${HUB_IMAGE}"$'\n'
            echo "::notice::Docker Hub 目标仓库：${HUB_IMAGE}"
          elif [[ "${WANT}" == "hub" ]]; then
            echo "::error::targets=hub 但未配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN"
            exit 1
          else
            echo "::notice::未配置 Docker Hub 凭据（或未选择），本次不推 Docker Hub"
          fi
          if [[ "${WANT_GHCR}" == "true" ]]; then
            IMAGES="${IMAGES}${GHCR_IMAGE}"$'\n'
            VERIFY_REPO="${GHCR_IMAGE}"
          else
            VERIFY_REPO="${HUB_IMAGE}"
          fi

          {
            echo "dockerhub=${WANT_HUB}"
            echo "ghcr=${WANT_GHCR}"
            echo "hub_image=${HUB_IMAGE}"
            echo "verify_repo=${VERIFY_REPO}"
            echo "images<<EOF"
            printf '%s' "${IMAGES}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        if: steps.targets.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: steps.targets.outputs.ghcr == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # [iventoy-fork L1] tag 事件取 tag 版本；其余触发（含 track-iventoy-release.yml
      # 的派发、手动 dispatch、main 分支推送）读取 Dockerfile 当前默认版本。
      # 任何解析失败都直接中止：静默回落到 Dockerfile 默认值会产出 tag 与内容不符的镜像。
      - name: Extract version
        id: version
        run: |
          set -euo pipefail
          PATTERN='IVENTOY_VERSION:-\K[0-9]+\.[0-9]+\.[0-9]+'
          DEFAULT_VERSION=$(grep -oP "$PATTERN" Dockerfile | head -1 || true)
          if [[ ! "${DEFAULT_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Dockerfile 中解析不出 IVENTOY_VERSION 默认值（'${DEFAULT_VERSION}'），终止构建"
            exit 1
          fi
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            VERSION="${VERSION#[vV]}"
          else
            VERSION="${DEFAULT_VERSION}"
          fi
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::无法从 ref '${GITHUB_REF}' 解析出合法版本号（'${VERSION}'），终止构建"
            exit 1
          fi
          if [[ "${VERSION}" != "${DEFAULT_VERSION}" ]]; then
            echo "::warning::tag 版本 ${VERSION} 与 Dockerfile 默认版本 ${DEFAULT_VERSION} 不一致，本次不更新 latest"
            echo "is_default=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_default=true" >> "$GITHUB_OUTPUT"
          fi
          echo "iventoy_version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.targets.outputs.images }}
          tags: |
            # [iventoy-fork L1] 标签策略：latest + 精确版本号（1.0.47 这类），不产出
            # major/minor/branch 浮动标签。latest 只在「tag 版本 == Dockerfile 默认版本」
            # 或非 tag 触发（dispatch / main 推送）时更新，推旧 tag 不会把 latest 回退。
            type=raw,value=latest,enable=${{ steps.version.outputs.is_default == 'true' }}
            type=semver,pattern={{version}}
            # [iventoy-fork L1] 显式补一个等于当前版本号的 raw 标签：type=semver 只在
            # ref 是 tag 时才生效，而 tracker / 手动 dispatch / main 推送都是「无 tag」触发 ——
            # 少了这行，发布出来的镜像只有 latest，Docker Hub 上会缺精确版本号，没法钉版本回滚。
            type=raw,value=${{ steps.version.outputs.iventoy_version }}

      # [iventoy-fork L2] 覆盖前先把当前 tag 指向的 digest 记下来。
      # 下面的校验只要有一项不过，就按这份记录把 tag 指回去 —— 这就是「强制覆盖」的兜底：
      # 覆盖是强制的，但覆盖错了能自动退回。
      - name: 记录现有 tag 的 digest（回滚用）
        id: prev
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -uo pipefail
          OUT="${RUNNER_TEMP}/prev-digests.tsv"
          : > "${OUT}"
          # [iventoy-fork] 两个坑，2026-11-13 那次 1.0.49 -> 1.0.50 就死在这里，构建根本没开始：
          # 1) TAGS 里会有重复（同一个 latest 按 docker.io / ghcr 各来一遍），先按行去重；
          # 2) 新版本号第一次发布时 tag 还不存在，imagetools 返回非零，配合 set -e + pipefail
          #    直接把整步打红。这里显式吞掉退出码，只当「没有旧值、回滚时跳过」。
          TAGS_UNIQ=$(printf '%s\n' "${TAGS}" | awk 'NF && !seen[$0]++')
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            D=$( { docker buildx imagetools inspect "$tag" 2>/dev/null || true; } \
                | awk '/^Digest:/{print $2; exit}')
            if [ -n "${D}" ]; then
              printf '%s\t%s\n' "$tag" "${D}" >> "${OUT}"
              echo "现有 ${tag} -> ${D}"
            else
              echo "现有 ${tag} -> <不存在，回滚时跳过>"
            fi
          done <<< "${TAGS_UNIQ}"
          echo "记录条数：$(wc -l < "${OUT}")"

      - name: Build and push（强制覆盖 latest / 版本号）
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # [iventoy-fork L1] 关闭 provenance/SBOM attestation：它们会在镜像 index 里
          # 额外产生 unknown/unknown 平台条目，污染平台清单。代价是失去 SLSA 证明。
          provenance: false
          sbom: false
          build-args: |
            IVENTOY_VERSION=${{ steps.version.outputs.iventoy_version }}
            IVENTOY_MAX_CLIENTS=${{ vars.IVENTOY_MAX_CLIENTS || '65535' }}
          # [iventoy-fork L1] gha 缓存默认按 ref 隔离，每个新 tag 都冷启动。
          # 显式 scope 让所有 tag / 分支共用同一份缓存。
          cache-from: type=gha,scope=iventoy
          cache-to: type=gha,mode=max,scope=iventoy

      # [iventoy-fork L1] 扫「真正发布出去的那个镜像」。Docker Hub 自己也会扫，但它的
      # 计数口径和阈值都不透明；这里用同一套 trivy 口径在流水线里留痕，并且 CRITICAL 直接失败。
      # 只扫 amd64：OS 基础包两个架构同一来源，arch 差异不改变结论，省一半时间。
      - name: 漏洞扫描（trivy，CRITICAL 即失败）
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          IMG: ${{ steps.targets.outputs.verify_repo }}:${{ steps.version.outputs.iventoy_version }}
        run: |
          set -euo pipefail
          echo "扫描对象：${IMG}（amd64）"
          VER=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
              https://api.github.com/repos/aquasecurity/trivy/releases/latest | python3 -c 'import json,sys;print(json.load(sys.stdin)["tag_name"])')
          curl -fsSL -o /tmp/trivy.tgz \
              "https://github.com/aquasecurity/trivy/releases/download/${VER}/trivy_${VER#v}_Linux-64bit.tar.gz"
          tar -xzf /tmp/trivy.tgz -C /usr/local/bin trivy && chmod +x /usr/local/bin/trivy
          trivy image --no-progress --severity CRITICAL,HIGH,MEDIUM,LOW \
              --format json "${IMG}" > /tmp/trivy.json
          python3 - <<'PY'
          import json, os
          from collections import Counter
          d = json.load(open('/tmp/trivy.json'))
          sev = Counter()
          pkgs = Counter()
          for r in (d.get('Results') or []):
              for v in (r.get('Vulnerabilities') or []):
                  sev[v['Severity']] += 1
                  pkgs[v.get('PkgName')] += 1
          lines = [
              '| 级别 | 条数 |', '|---|---|',
              '| CRITICAL | %d |' % sev.get('CRITICAL', 0),
              '| HIGH | %d |' % sev.get('HIGH', 0),
              '| MEDIUM | %d |' % sev.get('MEDIUM', 0),
              '| LOW | %d |' % sev.get('LOW', 0),
              '', '命中最多的包：' + '、'.join('%s(%d)' % kv for kv in pkgs.most_common(6)),
          ]
          print('\n'.join(lines))
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as fh:
                  fh.write('### 镜像漏洞扫描（trivy）\n\n' + '\n'.join(lines) + '\n')
          if sev.get('CRITICAL', 0):
              print('::error::存在 CRITICAL 级漏洞，禁止发布')
              raise SystemExit(1)
          print('无 CRITICAL，放行（HIGH 及以下仅记录，不拦截）')
          PY

      # [iventoy-fork L1] 给宿主内核注册 qemu binfmt。
      # buildx 的 docker-container driver 自带 qemu，所以上面的多架构构建不需要它；
      # 但下面的冒烟用 `docker run --platform linux/arm64`，走的是宿主内核 ——
      # 没有 binfmt 时 arm64 容器会直接 ENOEXEC（exec format error），
      # 而构建阶段是完全正常的，很容易误判成「镜像坏了」。
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # [iventoy-fork L1] 镜像能不能真的跑起来，只有扫漏洞是看不出来的。
      # 这里把刚发布的镜像按架构拉下来起一遍，确认 WebUI（26000）能应答：
      # 换底包 / 换上游版本这类改动，最先坏的就是「起不来」，而这个检查能当场抓住。
      # 两个架构串行跑（26000 只能占用一次）。
      - name: 冒烟：按架构起容器并确认 WebUI 应答
        env:
          IMG: ${{ steps.targets.outputs.verify_repo }}:${{ steps.version.outputs.iventoy_version }}
        run: |
          set -euo pipefail
          rc=0
          for arch in amd64 arm64; do
            name="iv-smoke-${arch}"
            docker rm -f "$name" >/dev/null 2>&1 || true
            # 先删掉上一个架构残留的本地镜像：否则 docker 可能直接复用本地那份，
            # 拉到的就不是目标架构（表现就是 exec format error）
            docker rmi -f "${IMG}" >/dev/null 2>&1 || true
            echo "--- ${arch}: 拉取并运行 ${IMG} ---"
            # [iventoy-fork] 不要用 docker image inspect .Architecture 判断架构：
            # containerd 镜像存储（新 runner / 101 上的 docker 27+ 都是）下拉多架构 tag
            # 存的是 index，这个字段直接是空的 —— #35 的 arm64 就是被它判成 '' 红的。
            # 真正的判据是容器里能跑出什么：uname -m。
            got=$(docker run --rm --platform "linux/${arch}" --entrypoint /bin/uname \
              "${IMG}" -m 2>/dev/null || true)
            case "${got}" in
              x86_64)  got=amd64 ;;
              aarch64) got=arm64 ;;
            esac
            if [ "${got}" != "${arch}" ]; then
              echo "::error::${arch} 容器里 uname -m 得到 '${got}'，与预期不符"
              rc=1; continue
            fi
            echo "  架构校验通过：${got}"
            if ! docker run -d --name "$name" --platform "linux/${arch}" \
                --privileged -p 26000:26000 --restart no "$IMG" >/dev/null; then
              echo "::error::${arch} 容器启动失败"; rc=1; continue
            fi
            tries=25
            [ "${arch}" = "arm64" ] && tries=45   # QEMU 下启动明显更慢，多给一倍时间
            code=000
            for i in $(seq 1 ${tries}); do
              sleep 3
              code=$(curl -s -o /tmp/smoke.html -w '%{http_code}' --max-time 5 http://127.0.0.1:26000/ || echo 000)
              [ "$code" = "200" ] && break
            done
            if [ "$code" = "200" ]; then
              # [iventoy-fork L2] 只看 200 是不够的：补丁把 WebUI 打坏时，服务照样返回
              # 200，正文只有 1 字节（浏览器一片全白）。2026-11-11 那次就是这个形态，
              # 冒烟全绿、镜像发出去、用户打开是白页。这里改成断言页面真的是一份 HTML。
              bytes=$(wc -c < /tmp/smoke.html)
              echo "  ${arch} WebUI -> HTTP 200（${bytes} 字节）"
              if [ "${bytes}" -lt 20000 ] || ! grep -qi '<html' /tmp/smoke.html; then
                echo "::error::${arch} WebUI 正文异常（${bytes} 字节，不含 <html>）：服务起来了但页面是空的"
                head -c 200 /tmp/smoke.html | sed 's/^/    /'
                rc=1
              fi
              # [iventoy-fork] 顺手确认补丁真的在镜像里：patch.json 缺失或 ok!=true，
              # 说明构建期补丁被跳过 / 失败被吞，WebUI 也可能是带着随机端口的假活。
              if ! docker run --rm --platform "linux/${arch}" --entrypoint /bin/sh "$IMG" \
                   -c 'grep -q "\"ok\": true" /usr/share/iventoy/patch.json'; then
                echo "::error::${arch} 镜像内 patch.json 缺失或 ok!=true，补丁未生效"
                rc=1
              else
                echo "  ${arch} patch.json ok"
              # [iventoy-fork L2] 三个按钮在免费版里还有一道前台闸门：matrix-boot.html 里
              # if (g_current_edition === 0) 直接弹「此功能只在专业版本中支持」，接口根本
              # 不会被调用。钩子在 tarfs 内存里把这个赋值改成了 1，这里确认页面真的是拆过的。
              # 赋初值的位置随上游版本变：1.0.49 在 index.html，1.0.50 挪到了
              # static/js/vtoy.js（vtoy_common_fill_sysinfo 里）。两处都查，任一命中即算拆开。
              # 注意：这里的 grep 必须自带 `|| true`。脚本是 set -euo pipefail，
              # 「没匹配到」的 grep 返回 1 会把整步直接打死 —— #34 就是这么红的：
              # 1.0.50 的 index.html 里本来就没有这句，第一个探针一失配就退出了。
              gate=""
              for probe in / /static/js/vtoy.js; do
                [ -n "${gate}" ] && break
                body=$(curl -s --max-time 10 "http://127.0.0.1:26000${probe}" || true)
                gate=$(printf '%s' "${body}" | grep -o 'g_current_edition = 1[^;]*;' | head -1 || true)
              done
              if [ -z "${gate}" ]; then
                echo "::error::${arch} WebUI 前台闸门没拆开（index.html / vtoy.js 里都还是 0）"
                for probe in / /static/js/vtoy.js; do
                  printf '%s' "$(curl -s --max-time 10 "http://127.0.0.1:26000${probe}" || true)" \
                    | grep -o 'g_current_edition[^;]*;' | head -3 | sed 's/^/    /' || true
                done
                rc=1
              else
                echo "  ${arch} WebUI 前台闸门已拆（${gate}）"
                # 「版本信息」页会把全局值覆盖回服务端返回的 edition（免费版硬编码 0），
                # 不盖掉它页脚又会变回「免费版本」。这里确认那一处也被替换成了常量 1。
                if ! curl -s --max-time 10 http://127.0.0.1:26000/vtoy_register.html | grep -q 'g_current_edition = 1 '; then
                  echo "::error::${arch} 版本信息页仍把 edition 覆盖回服务端值（页脚会显示免费版本）"
                  curl -s --max-time 10 http://127.0.0.1:26000/vtoy_register.html \
                    | grep -o 'g_current_edition = [^;]*;' | head -2 | sed 's/^/    /' || true
                  rc=1
                else
                  echo "  ${arch} 版本信息页 edition 已是常量"
                fi
              fi
              fi
              # [iventoy-fork L2] 分机独启（matrix boot）的通路是后补进去的私有实现，
              # 光看「服务起来了」证明不了它真的能用：这里直接打一次 add + list，
              # 拿不到 success / 列表里没有刚加的条目就红。
              addresp=$(curl -s -X POST -H 'Content-Type: application/json' --max-time 10 \
                -d '{"method":"add_matrix_boot","bios":1,"timeout":30,"mac":"11-22-33-44-55-66","path":"smoke.iso"}' \
                http://127.0.0.1:26000/iventoy/json || echo '<curl failed>')
              listresp=$(curl -s -X POST -H 'Content-Type: application/json' --max-time 10 \
                -d '{"method":"get_matrix_boot"}' http://127.0.0.1:26000/iventoy/json || echo '<curl failed>')
              echo "  ${arch} add_matrix_boot -> ${addresp}"
              if [[ "${addresp}" != *success* ]] || [[ "${listresp}" != *"11-22-33-44-55-66"* ]]; then
                echo "::error::${arch} 分机独启接口不可用（add=${addresp} list=${listresp}）"
                rc=1
              else
                echo "  ${arch} 分机独启 add/list ok"
              fi
              # [iventoy-fork L2] 条目能不能活过重启：启动恢复回调在免费版里同样被裁成桩
              # （只打日志不入链表），我们另外接管了它。这里真重启一次再确认列表。
              #
              # 不能只查一次：重启后先应答的是 WebUI 静态页，配置恢复（TLV 回放）在后面
              # 才完成。QEMU 下的 arm64 实测要 3s 以上，慢 runner 上更久。#26 那次红就是
              # 查早了 —— 列表当时还是空的。轮询到出现为止。
              docker restart "$name" >/dev/null
              list2=""
              for i in $(seq 1 60); do
                sleep 2
                list2=$(curl -s -X POST -H 'Content-Type: application/json' --max-time 10 \
                  -d '{"method":"get_matrix_boot"}' http://127.0.0.1:26000/iventoy/json 2>/dev/null || echo '')
                case "${list2}" in
                  *"11-22-33-44-55-66"*) break ;;
                esac
              done
              echo "  ${arch} 重启后 list -> ${list2}"
              if [[ "${list2}" != *"11-22-33-44-55-66"* ]]; then
                echo "::error::${arch} 重启后分机独启条目丢失（120s 内没等到恢复）"
                # 一次把判定依据打全：条目进没进 config.dat、文件有没有被判损坏、启动过程
                # 报了什么。缺了这些，下次再红还是只能靠猜。
                docker exec "$name" sh -c 'stat -c "    config.dat: %s bytes" /iventoy/data/config.dat' 2>/dev/null || true
                docker exec "$name" sh -c 'printf "    config.dat 条目计数: "; grep -c "11-22-33-44-55-66" /iventoy/data/config.dat 2>/dev/null || echo 0' 2>/dev/null || true
                docker logs "$name" 2>&1 | grep -iE 'corrupted|recover' | tail -10 | sed 's/^/    /' || true
                docker logs "$name" 2>&1 | tail -25 | sed 's/^/    /'
                rc=1
              fi
              # 「清除」走的是另一个接口（clr_matrix_boot），arm64 上它的桩被编译器折叠成
              # `b pxe_api_add_matrix_boot`，接管 add 之后会一脚踩进 add 的处理器里回 failed。
              # 所以这条必须单独打一遍：清除后列表要真的空。
              clrresp=$(curl -s -X POST -H 'Content-Type: application/json' --max-time 10 \
                -d '{"method":"clr_matrix_boot"}' http://127.0.0.1:26000/iventoy/json || echo '<curl failed>')
              clrlist=$(curl -s -X POST -H 'Content-Type: application/json' --max-time 10 \
                -d '{"method":"get_matrix_boot"}' http://127.0.0.1:26000/iventoy/json || echo '<curl failed>')
              echo "  ${arch} clr_matrix_boot -> ${clrresp}"
              if [[ "${clrresp}" != *success* ]] || [ "${clrlist}" != "[]" ]; then
                echo "::error::${arch} 分机独启清除失败（clr=${clrresp} list=${clrlist}）"
                rc=1
              else
                echo "  ${arch} 分机独启清除 ok（列表已空）"
              fi
              # config.dat 被写坏会整份丢弃（"config data corrupted, ignore it."），
              # 那时掉的是所有设置，不只是分机独启条目 —— 单独断言一条。
              if docker logs "$name" 2>&1 | grep -q 'config data corrupted'; then
                echo "::error::${arch} config.dat 被判损坏并丢弃（并发非原子写）"
                rc=1
              fi
            else
              echo "::error::${arch} WebUI 无应答（最后 HTTP ${code}）"
              docker logs "$name" 2>&1 | tail -15 | sed 's/^/    /'
              rc=1
            fi
            docker rm -f "$name" >/dev/null 2>&1 || true
          done
          exit $rc

      # [iventoy-fork] 冒烟只能证明「容器起得来」，证明不了「镜像里那份二进制是打过补丁的」。
      # 这里把镜像里的 lib/iventoy 和构建期写的 patch.json 一起拉出来，
      # 用补丁脚本的 --verify 逐站点对字节：任何一处被跳过 / 被回滚都会红。
      - name: 校验镜像内二进制与补丁报告一致
        env:
          IMG: ${{ steps.targets.outputs.verify_repo }}:${{ steps.version.outputs.iventoy_version }}
        run: |
          set -euo pipefail
          docker pull --quiet "${IMG}" >/dev/null
          docker run --rm --entrypoint cat "$IMG" /iventoy/lib/iventoy > /tmp/shipped.bin
          docker run --rm --entrypoint cat "$IMG" /usr/share/iventoy/patch.json > /tmp/shipped.json
          docker run --rm --entrypoint cat "$IMG" /usr/share/iventoy/patch-mb.json > /tmp/shipped-mb.json
          ls -l /tmp/shipped.bin /tmp/shipped.json /tmp/shipped-mb.json
          python3 patches/iventoy_patch.py --verify /tmp/shipped.json /tmp/shipped.bin
          python3 patches/matrix_boot_hook.py --verify /tmp/shipped-mb.json /tmp/shipped.bin
          # [iventoy-fork] 链式校验：主补丁的输出必须正好是分机独启钩子的输入，
          # 否则两份报告各自自洽、拼起来却不是同一条产线。
          python3 - <<'PY'
          import json, sys
          p = json.load(open('/tmp/shipped.json'))
          m = json.load(open('/tmp/shipped-mb.json'))
          if m["input_sha256"] != p["output_sha256"]:
              print("::error::链式校验失败：钩子的输入 %s != 主补丁的输出 %s"
                    % (m["input_sha256"][:16], p["output_sha256"][:16]))
              sys.exit(1)
          print("OK: 两段补丁链式校验通过（%s -> %s）"
                % (p["output_sha256"][:16], m["output_sha256"][:16]))
          PY

      # [iventoy-fork L2] 上面任何一步红了，就把 tag 指回覆盖之前记下的 digest。
      # 失败点可能在构建之后也可能在构建之前，两种情况都安全：
      # 前者把坏镜像撤下来，后者把 tag 指回它本来就指向的地方。
      - name: 回滚 tag（校验失败时）
        if: failure()
        env:
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ env.REGISTRY_IMAGE }}
        run: |
          set -uo pipefail
          F="${RUNNER_TEMP}/prev-digests.tsv"
          if [ ! -s "$F" ]; then
            echo "没有记录到旧的 tag digest，无可回滚（首次发布 / 记录步未执行）"
            exit 0
          fi
          rc=0
          while IFS=$'\t' read -r tag digest; do
            [ -n "${tag}" ] || continue
            repo="${tag%:*}"
            echo "回滚 ${tag} -> ${digest}"
            if docker buildx imagetools create -t "${tag}" "${repo}@${digest}"; then
              echo "  已回滚"
            else
              echo "::error::回滚 ${tag} 失败（${repo}@${digest}）"
              rc=1
            fi
          done < "$F"
          {
            echo "### 回滚"
            echo ""
            echo '```'
            cat "$F"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      # [iventoy-fork L1] 发布成功后把 DOCKERHUB.md 同步成 Docker Hub 的说明页
      # （短描述 + 正文 README）。只在「更新 latest」的那次同步，避免旧 tag 重建时
      # 把页面改回旧文档；失败只告警、不拦发布（文档不同步不该让镜像发布变红）。
      - name: Sync Docker Hub page
        if: success() && steps.targets.outputs.dockerhub == 'true' && steps.version.outputs.is_default == 'true'
        continue-on-error: true
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REGISTRY_IMAGE: ${{ env.REGISTRY_IMAGE }}
        run: |
          set -euo pipefail
          echo "目标仓库：${DOCKERHUB_USERNAME}/${REGISTRY_IMAGE}"
          python3 .github/scripts/sync-dockerhub-page.py

      # [iventoy-fork L2] 一轮构建到底发布成了什么，写进 run summary：
      # 版本、源码提交、补丁上限、digest、tag。看 run 列表就能判断「这份镜像对应哪份代码」。
      - name: 发布摘要
        if: always()
        env:
          VERSION: ${{ steps.version.outputs.iventoy_version }}
          TAGS: ${{ steps.meta.outputs.tags }}
          REV: ${{ github.sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PATCHED: ${{ vars.IVENTOY_MAX_CLIENTS || '65535' }}
        run: |
          {
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 上游版本 | ${VERSION:-<未知>} |"
            echo "| 源码提交 | \`${REV}\` |"
            echo "| 客户端上限 | ${PATCHED} |"
            echo "| digest | \`${DIGEST:-<未知>}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # [iventoy-fork] 失败必须留下能接手的产物。以前只把 run 标红：ghcr 镜像停在旧版，
  # 也没有任何 issue / PR，等于要人天天盯 Actions 列表才发现（2026-11-13 的 #33 就是这样）。
  # 现在失败时把 run 链接、失败步骤、日志尾部与复现命令写成 dsh-handoff issue；
  # 同一个版本的 issue 已存在就追加评论，不重复开。
  handoff:
    needs: build
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: 汇总失败上下文
        id: ctx
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          V=$(sed -n 's/.*IVENTOY_VERSION:-\([0-9][0-9.]*\).*/\1/p' Dockerfile | head -1)
          echo "title=构建失败: iVentoy ${V:-unknown}" >> "${GITHUB_OUTPUT}"
          {
            echo "## 构建失败：iVentoy ${V:-<未知版本>}"
            echo
            echo "- 提交：\`${{ github.sha }}\`"
            echo "- 触发：\`${{ github.event_name }}\`（\`${{ github.ref_name }}\`）"
            echo "- 运行：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- ghcr 镜像：仍是上一版（本次没有推送成功）"
            echo
            echo "### 失败步骤日志（尾部 120 行）"
            echo '```'
            gh run view "${{ github.run_id }}" --log-failed 2>/dev/null | tail -120 || echo '<取不到日志>'
            echo '```'
            echo
            echo "### 接手怎么做"
            echo
            echo '```bash'
            echo "# 拉上游包（版本见 Dockerfile 的 IVENTOY_VERSION）"
            echo "curl -sSL -O https://github.com/ventoy/PXE/releases/download/v<版本>/iventoy-<版本>-linux-x86_64-free.tar.gz"
            echo "tar -xzf iventoy-*.tar.gz -C /tmp/x --strip-components=1"
            echo "# 复现补丁链（两架构各一遍；arm64 包名是 -linux-arm64-trial）"
            echo "python3 patches/iventoy_patch.py --max-clients 65535 --report /tmp/p1.json /tmp/x/lib/iventoy"
            echo "python3 patches/matrix_boot_hook.py /tmp/x/lib/iventoy --report /tmp/p2.json"
            echo "python3 patches/matrix_boot_hook.py /tmp/x/lib/iventoy --verify /tmp/p2.json"
            echo '```'
            echo
            echo "补丁站点表与适配方法见 \`patches/README.md\`。"
            echo "构建期若报「符号找不到 / 大小不合理 / 落点放不下」，通常是上游改了这两处："
            echo "桩函数的形态、或 RX 段的尾部空隙大小。"
          } > /tmp/handoff.md
          cat /tmp/handoff.md

      - uses: ./.github/actions/handoff
        with:
          title: ${{ steps.ctx.outputs.title }}
          body-file: /tmp/handoff.md
