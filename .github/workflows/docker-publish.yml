name: Build and Push Docker Images

on:
  push:
    # [iventoy-fork L2] main 的提交也直接发布，并且**强制覆盖** latest / 版本号：
    # 镜像必须跟着代码走，不再另开 :edge 之类的旁路 tag。
    # [iventoy-fork L1] tag 只接受语义化版本号。此前是 "*"，任意 tag 都能触发构建，
    # 而 latest 又会无条件刷新，推一个旧 tag 就会把 latest 回退到旧版本。
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      targets:
        description: "发布到哪里"
        type: choice
        options:
          - both # ghcr.io + Docker Hub（默认）
          - hub # 只推 Docker Hub（用它补铺/修 Hub 上的镜像，不动 ghcr）
          - ghcr # 只推 ghcr.io
        default: both
        required: false

permissions:
  # [iventoy-fork L1] 本 workflow 不写仓库内容，只推镜像包：权限收紧到最小集合。
  contents: read
  packages: write

env:
  REGISTRY_IMAGE: iventoy
  # 构建产物先以「仅 digest、无 tag」的形式推到这里，校验通过后才移动 tag。
  GHCR_REPO: ghcr.io/${{ github.repository_owner }}/iventoy

# 同一 ref 的构建串行执行。现在每次构建的最后一步都是强制移动 tag，
# 所以**不做 cancel-in-progress**：半途取消可能只移动了一部分 tag（latest 走了、版本号没走）。
# 连续推送就排队，宁可多跑一次也不留半新半旧的状态。
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # [iventoy-fork L0] 发布前先跑 entrypoint 自检：启动逻辑是镜像唯一的自有代码，
  # 之前 tests/ 只在本地 make test 里跑，CI 从不执行。
  #
  # track-iventoy-release.yml 的版本 bump 提交（`chore: auto-update iVentoy ...`）
  # 会在同一次运行里紧接着打 tag，那条 tag 推送会触发一次完整的发布构建；
  # bump 提交自己再发布一遍纯属重复，这里直接跳过。
  test:
    if: >-
      github.event_name != 'push'
      || github.ref != 'refs/heads/main'
      || !contains(github.event.head_commit.message, 'auto-update iVentoy')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Container entrypoint self-test
        run: sh tests/test-container-entrypoint.sh

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # [iventoy-fork L1] fork 不继承上游仓库的 secrets。未配置 Docker Hub 凭据时
      # 只发布到 ghcr.io，避免 login/push 步骤直接失败。
      # secrets 一律经 env 传入，不直接插值进 shell，避免特殊字符破坏脚本。
      #
      # targets 输入支持「只推 Hub / 只推 ghcr」：补铺 Docker Hub 时不必顺带重建 ghcr。
      - name: Resolve publish targets
        id: targets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          WANT: ${{ inputs.targets || 'both' }}
        run: |
          set -euo pipefail
          HUB_IMAGE="docker.io/${DOCKERHUB_USERNAME}/${REGISTRY_IMAGE}"
          HAVE_HUB=false
          if [[ -n "${DOCKERHUB_USERNAME}" && -n "${DOCKERHUB_TOKEN}" ]]; then
            HAVE_HUB=true
          fi

          # 镜像清单（metadata 用的目标列表）
          IMAGES=""
          case "${WANT}" in
            both) WANT_HUB=$HAVE_HUB; WANT_GHCR=true ;;
            hub)  WANT_HUB=$HAVE_HUB; WANT_GHCR=false ;;
            ghcr) WANT_HUB=false;     WANT_GHCR=true ;;
            *) echo "::error::未知 targets='${WANT}'"; exit 1 ;;
          esac

          if [[ "${WANT_HUB}" == "true" ]]; then
            IMAGES="${HUB_IMAGE}"$'\n'
            echo "::notice::Docker Hub 目标仓库：${HUB_IMAGE}"
          elif [[ "${WANT}" == "hub" ]]; then
            echo "::error::targets=hub 但未配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN"
            exit 1
          else
            echo "::notice::未配置 Docker Hub 凭据（或未选择），本次不推 Docker Hub"
          fi
          if [[ "${WANT_GHCR}" == "true" ]]; then
            IMAGES="${IMAGES}${GHCR_REPO}"$'\n'
          fi

          {
            echo "dockerhub=${WANT_HUB}"
            echo "ghcr=${WANT_GHCR}"
            echo "hub_image=${HUB_IMAGE}"
            echo "images<<EOF"
            printf '%s' "${IMAGES}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        if: steps.targets.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # [iventoy-fork L1] tag 事件取 tag 版本；其余触发（含 track-iventoy-release.yml
      # 的派发、手动 dispatch、main 分支推送）读取 Dockerfile 当前默认版本。
      # 任何解析失败都直接中止：静默回落到 Dockerfile 默认值会产出 tag 与内容不符的镜像。
      - name: Extract version
        id: version
        run: |
          set -euo pipefail
          PATTERN='IVENTOY_VERSION:-\K[0-9]+\.[0-9]+\.[0-9]+'
          DEFAULT_VERSION=$(grep -oP "$PATTERN" Dockerfile | head -1 || true)
          if [[ ! "${DEFAULT_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Dockerfile 中解析不出 IVENTOY_VERSION 默认值（'${DEFAULT_VERSION}'），终止构建"
            exit 1
          fi
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            VERSION="${VERSION#[vV]}"
          else
            VERSION="${DEFAULT_VERSION}"
          fi
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::无法从 ref '${GITHUB_REF}' 解析出合法版本号（'${VERSION}'），终止构建"
            exit 1
          fi
          if [[ "${VERSION}" != "${DEFAULT_VERSION}" ]]; then
            echo "::warning::tag 版本 ${VERSION} 与 Dockerfile 默认版本 ${DEFAULT_VERSION} 不一致，本次不更新 latest"
            echo "is_default=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_default=true" >> "$GITHUB_OUTPUT"
          fi
          echo "iventoy_version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.targets.outputs.images }}
          tags: |
            # [iventoy-fork L1] 标签策略：latest + 精确版本号（1.0.47 这类），不产出
            # major/minor/branch 浮动标签。latest 只在「tag 版本 == Dockerfile 默认版本」
            # 或非 tag 触发（dispatch / main 推送）时更新，推旧 tag 不会把 latest 回退。
            type=raw,value=latest,enable=${{ steps.version.outputs.is_default == 'true' }}
            type=semver,pattern={{version}}
            # [iventoy-fork L1] 显式补一个等于当前版本号的 raw 标签：type=semver 只在
            # ref 是 tag 时才生效，而 tracker / 手动 dispatch / main 推送都是「无 tag」触发 ——
            # 少了这行，发布出来的镜像只有 latest，Docker Hub 上会缺精确版本号，没法钉版本回滚。
            type=raw,value=${{ steps.version.outputs.iventoy_version }}

      # [iventoy-fork L2] 构建产物**先不带 tag**，只按 digest 推上去：
      # 下面的漏洞扫描 / 两架构冒烟 / 补丁产物校验全部针对这个 digest 跑，
      # 全过了才把 latest / 版本号移过去（见最后的「发布标签」步骤）。
      # 这样既满足「新构建强制覆盖」，又不会把坏镜像怼到 latest 上等人来发现。
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.GHCR_REPO }},push-by-digest=true,name-canonical=true
          labels: ${{ steps.meta.outputs.labels }}
          # [iventoy-fork L1] 关闭 provenance/SBOM attestation：它们会在镜像 index 里
          # 额外产生 unknown/unknown 平台条目，污染平台清单。代价是失去 SLSA 证明。
          provenance: false
          sbom: false
          build-args: |
            IVENTOY_VERSION=${{ steps.version.outputs.iventoy_version }}
            IVENTOY_MAX_CLIENTS=${{ vars.IVENTOY_MAX_CLIENTS || '65535' }}
          # [iventoy-fork L1] gha 缓存默认按 ref 隔离，每个新 tag 都冷启动。
          # 显式 scope 让所有 tag / 分支共用同一份缓存。
          cache-from: type=gha,scope=iventoy
          cache-to: type=gha,mode=max,scope=iventoy

      - name: 断言构建 digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::拿不到构建产物 digest（'${DIGEST}'），后面所有校验和发布都无从进行"
            exit 1
          fi
          echo "构建产物：${GHCR_REPO}@${DIGEST}"
          {
            echo "### 构建产物"
            echo ""
            echo "\`${GHCR_REPO}@${DIGEST}\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      # [iventoy-fork L1] 扫「这一份构建产物」。Docker Hub 自己也会扫，但它的计数口径和
      # 阈值都不透明；这里用同一套 trivy 口径在流水线里留痕，并且 CRITICAL 直接失败。
      # 只扫 amd64：OS 基础包两个架构同一来源，arch 差异不改变结论，省一半时间。
      - name: 漏洞扫描（trivy，CRITICAL 即失败）
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          IMG="${GHCR_REPO}@${DIGEST}"
          echo "扫描对象：${IMG}（amd64）"
          VER=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
              https://api.github.com/repos/aquasecurity/trivy/releases/latest | python3 -c 'import json,sys;print(json.load(sys.stdin)["tag_name"])')
          curl -fsSL -o /tmp/trivy.tgz \
              "https://github.com/aquasecurity/trivy/releases/download/${VER}/trivy_${VER#v}_Linux-64bit.tar.gz"
          tar -xzf /tmp/trivy.tgz -C /usr/local/bin trivy && chmod +x /usr/local/bin/trivy
          trivy image --no-progress --severity CRITICAL,HIGH,MEDIUM,LOW \
              --format json "${IMG}" > /tmp/trivy.json
          python3 - <<'PY'
          import json, os
          from collections import Counter
          d = json.load(open('/tmp/trivy.json'))
          sev = Counter()
          pkgs = Counter()
          for r in (d.get('Results') or []):
              for v in (r.get('Vulnerabilities') or []):
                  sev[v['Severity']] += 1
                  pkgs[v.get('PkgName')] += 1
          lines = [
              '| 级别 | 条数 |', '|---|---|',
              '| CRITICAL | %d |' % sev.get('CRITICAL', 0),
              '| HIGH | %d |' % sev.get('HIGH', 0),
              '| MEDIUM | %d |' % sev.get('MEDIUM', 0),
              '| LOW | %d |' % sev.get('LOW', 0),
              '', '命中最多的包：' + '、'.join('%s(%d)' % kv for kv in pkgs.most_common(6)),
          ]
          print('\n'.join(lines))
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as fh:
                  fh.write('### 镜像漏洞扫描（trivy）\n\n' + '\n'.join(lines) + '\n')
          if sev.get('CRITICAL', 0):
              print('::error::存在 CRITICAL 级漏洞，禁止发布')
              raise SystemExit(1)
          print('无 CRITICAL，放行（HIGH 及以下仅记录，不拦截）')
          PY

      # [iventoy-fork L1] 给宿主内核注册 qemu binfmt。
      # buildx 的 docker-container driver 自带 qemu，所以上面的多架构构建不需要它；
      # 但下面的冒烟用 `docker run --platform linux/arm64`，走的是宿主内核 ——
      # 没有 binfmt 时 arm64 容器会直接 ENOEXEC（exec format error），
      # 而构建阶段是完全正常的，很容易误判成「镜像坏了」。
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # [iventoy-fork L1] 镜像能不能真的跑起来，只有扫漏洞是看不出来的。
      # 这里把构建产物按架构拉下来起一遍，确认 WebUI（26000）能应答。
      # 两个架构串行跑（26000 只能占用一次）。
      - name: 冒烟：按架构起容器并确认 WebUI 应答
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          IMG="${GHCR_REPO}@${DIGEST}"
          rc=0
          for arch in amd64 arm64; do
            name="iv-smoke-${arch}"
            docker rm -f "$name" >/dev/null 2>&1 || true
            echo "--- ${arch}: 拉取并运行 ${IMG} ---"
            if ! docker pull --quiet --platform "linux/${arch}" "${IMG}" >/dev/null; then
              echo "::error::${arch} 拉取失败"; rc=1; continue
            fi
            got=$(docker image inspect -f '{{.Architecture}}' "${IMG}" 2>/dev/null || echo unknown)
            if [ "${got}" != "${arch}" ]; then
              echo "::error::${arch} 拉到的镜像架构是 '${got}'，与预期不符"
              rc=1; continue
            fi
            echo "  架构校验通过：${got}"
            if ! docker run -d --name "$name" --platform "linux/${arch}" \
                --privileged -p 26000:26000 --restart no "$IMG" >/dev/null; then
              echo "::error::${arch} 容器启动失败"; rc=1; continue
            fi
            tries=25
            [ "${arch}" = "arm64" ] && tries=45   # QEMU 下启动明显更慢，多给一倍时间
            code=000
            for i in $(seq 1 ${tries}); do
              sleep 3
              code=$(curl -s -o /tmp/smoke.html -w '%{http_code}' --max-time 5 http://127.0.0.1:26000/ || echo 000)
              [ "$code" = "200" ] && break
            done
            if [ "$code" = "200" ]; then
              echo "  ${arch} WebUI -> HTTP 200（$(wc -c < /tmp/smoke.html) 字节）"
              # [iventoy-fork] 顺手确认补丁真的在镜像里：patch.json 缺失或 ok!=true，
              # 说明构建期补丁被跳过 / 失败被吞，WebUI 也可能是带着随机端口的假活。
              if ! docker run --rm --platform "linux/${arch}" --entrypoint /bin/sh "$IMG" \
                   -c 'grep -q "\"ok\": true" /usr/share/iventoy/patch.json'; then
                echo "::error::${arch} 镜像内 patch.json 缺失或 ok!=true，补丁未生效"
                rc=1
              else
                echo "  ${arch} patch.json ok"
              fi
            else
              echo "::error::${arch} WebUI 无应答（最后 HTTP ${code}）"
              docker logs "$name" 2>&1 | tail -15 | sed 's/^/    /'
              rc=1
            fi
            docker rm -f "$name" >/dev/null 2>&1 || true
          done
          exit $rc

      # [iventoy-fork] 冒烟只能证明「容器起得来」，证明不了「镜像里那份二进制是打过补丁的」。
      # 这里把镜像里的 lib/iventoy 和构建期写的 patch.json 一起拉出来，
      # 用补丁脚本的 --verify 逐站点对字节：任何一处被跳过 / 被回滚都会红。
      - name: 校验镜像内二进制与补丁报告一致
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          IMG="${GHCR_REPO}@${DIGEST}"
          docker pull --quiet "$IMG" >/dev/null
          docker run --rm --entrypoint cat "$IMG" /iventoy/lib/iventoy > /tmp/shipped.bin
          docker run --rm --entrypoint cat "$IMG" /usr/share/iventoy/patch.json > /tmp/shipped.json
          ls -l /tmp/shipped.bin /tmp/shipped.json
          python3 patches/iventoy_patch.py --verify /tmp/shipped.json /tmp/shipped.bin

      # [iventoy-fork L2] 校验全过才移动 tag —— 这一步就是「强制覆盖」：
      # 同一个 latest / 版本号被指到新 digest 上，旧 tag 同时失效。
      # 跨 registry（Docker Hub）也从同一个 digest 复制，保证两边字节一致。
      - name: 发布标签（latest / 版本号强制覆盖）
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          if [[ -z "${TAGS}" ]]; then
            echo "::error::metadata 没产出任何 tag，终止"
            exit 1
          fi
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            echo "--- ${tag} <- ${GHCR_REPO}@${DIGEST} ---"
            docker buildx imagetools create -t "$tag" "${GHCR_REPO}@${DIGEST}"
          done <<< "${TAGS}"
          echo '--- 发布结果 ---'
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker buildx imagetools inspect "$tag" | head -6
          done <<< "${TAGS}"
          {
            echo "### 已发布标签"
            echo ""
            echo '```'
            printf '%s\n' "${TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # [iventoy-fork L1] tag 移动成功后把 DOCKERHUB.md 同步成 Docker Hub 的说明页
      # （短描述 + 正文 README）。只在「更新 latest」的那次同步，避免旧 tag 重建时
      # 把页面改回旧文档；失败只告警、不拦发布（文档不同步不该让镜像发布变红）。
      - name: Sync Docker Hub page
        if: steps.targets.outputs.dockerhub == 'true' && steps.version.outputs.is_default == 'true'
        continue-on-error: true
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REGISTRY_IMAGE: ${{ env.REGISTRY_IMAGE }}
        run: |
          set -euo pipefail
          echo "目标仓库：${DOCKERHUB_USERNAME}/${REGISTRY_IMAGE}"
          python3 .github/scripts/sync-dockerhub-page.py

      # [iventoy-fork L2] 一轮构建到底发布成了什么，写进 run summary：
      # 版本、源码提交、补丁上限、digest、tag。看 run 列表就能判断「这份镜像对应哪份代码」。
      - name: 发布摘要
        if: always()
        env:
          VERSION: ${{ steps.version.outputs.iventoy_version }}
          TAGS: ${{ steps.meta.outputs.tags }}
          REV: ${{ github.sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PATCHED: ${{ vars.IVENTOY_MAX_CLIENTS || '65535' }}
        run: |
          {
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 上游版本 | ${VERSION:-<未知>} |"
            echo "| 源码提交 | \`${REV}\` |"
            echo "| 客户端上限 | ${PATCHED} |"
            echo "| digest | \`${DIGEST:-<未知>}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
