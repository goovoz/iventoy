services:
  iventoy:
    image: deemop/iventoy:latest
    container_name: iventoy
    restart: unless-stopped
    network_mode: host
    privileged: true
    init: true
    stop_grace_period: 30s
    environment:
      TZ: Asia/Shanghai
      IVENTOY_AUTO_RUN: "0"
    volumes:
      - ./iventoy-data:/iventoy/data
      - ./iventoy-iso:/iventoy/iso
      - ./iventoy-driver:/iventoy/driver
      - ./iventoy-user:/iventoy/user
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
