---
# 镜像统一走 ghcr.io/goovoz/iventoy:latest（跟随本仓库自动发布的最新版本）。
# 需要钉版本时把 :latest 换成 :1.0.46 之类的精确 tag（每个版本都同时发布 latest 与 X.Y.Z）。
services:
    iventoy:
        image: ghcr.io/goovoz/iventoy:latest
        container_name: iventoy
        hostname: iventoy
        restart: unless-stopped
        # iVentoy 需要操作网络接口与挂载，必须 privileged
        privileged: true
        environment:
            TZ: Asia/Shanghai
            # 自动启动默认关闭：先在 Web UI 里确认 Server IP、并把 DHCP 模式设成 External，
            # 之后再改成 "1" 让它随容器自动启动 PXE 服务。
            IVENTOY_AUTO_RUN: "0"
        volumes:
            - /data/iventoy/data:/iventoy/data
            - /data/iventoy/iso:/iventoy/iso
            - /data/iventoy/driver:/iventoy/driver
            - /data/iventoy/user:/iventoy/user
        # 端口默认值取自 iVentoy 1.0.46 内置 Web UI（get_config_all）。
        # 除 26000 外的 TCP 端口都能在 Configuration 页改，改了这里也要跟着改。
        ports:
            - 26000:26000 # Web UI（固定，不可配置）
            - 16000:16000 # HTTP 文件服务（bootfile / ISO 下载）
            - 10809:10809 # NBD
            - 3260:3260 # iSCSI
            - 10445:10445 # SMB
            - 12049:12049 # NFS
            - 69:69/udp # TFTP
        # 下面两个 UDP 端口只有让 iVentoy 自己跑 DHCP 时才需要，且依赖二层广播：
        #   67/udp    内置 DHCP（ProxyNet / External 模式）
        #   4011/udp  proxyDHCP（Proxy / ProxyNet 模式）
        # bridge 网络收不到广播，要启用就把下面这段的注释换上来，并注释掉上面所有 ports：
        #   network_mode: host
        #   然后不再需要 ports 映射（host 模式直接用宿主机端口）
