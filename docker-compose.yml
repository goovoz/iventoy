---
services:
    iVentoy:
        image: ghcr.io/goovoz/iventoy:1.0.46
        container_name: iventoy
        restart: unless-stopped
        privileged: true
        hostname: iventoy
        volumes:
            - /data/iventoy/data:/iventoy/data
            - /data/iventoy/iso:/iventoy/iso
        ports:
            - 26000:26000
            - 16000:16000
            - 10809:10809
            - 69:69/udp
